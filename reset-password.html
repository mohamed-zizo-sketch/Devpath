<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DEVPATH — Reset Password</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="./css/global.css">
  <link rel="stylesheet" href="./css/animations.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #03032d 0%, #0a0a3a 30%, #111155 60%, #0d1a6a 100%);
      background-size: 400% 400%;
      animation: gradientShift 12s ease infinite;
      padding: var(--space-lg);
    }

    .back-home {
      position: fixed;
      top: var(--space-lg);
      left: var(--space-lg);
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      font-size: 0.9rem;
      text-decoration: none;
      transition: color var(--transition-fast);
      z-index: 10;
    }

    .back-home:hover {
      color: var(--accent-cyan);
    }

    .back-home .nav-logo {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
    }

    .reset-card {
      width: 100%;
      max-width: 480px;
      background: var(--bg-card);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-xl);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: var(--space-3xl) var(--space-2xl);
      box-shadow: var(--shadow-lg);
      animation: scaleIn 0.5s var(--ease-out) both;
    }

    .reset-card h2 {
      font-size: 1.8rem;
      margin-bottom: var(--space-xs);
    }

    .reset-card .reset-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: var(--space-lg);
    }

    .error-box {
      display: none;
      background: rgba(248, 113, 113, 0.15);
      border: 1px solid rgba(248, 113, 113, 0.3);
      color: #f87171;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: var(--space-lg);
    }

    .success-box {
      display: none;
      background: rgba(52, 211, 153, 0.15);
      border: 1px solid rgba(52, 211, 153, 0.3);
      color: #34d399;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: var(--space-lg);
      text-align: center;
    }

    .input-group {
      margin-bottom: var(--space-md);
      position: relative;
    }

    .input-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .input-group input {
      width: 100%;
      padding: 14px 44px 14px 44px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      font-family: var(--font-body);
      font-size: 0.9rem;
      transition: all var(--transition-fast);
      outline: none;
    }

    .input-group input:focus {
      border-color: var(--accent-cyan);
      background: rgba(0, 229, 255, 0.05);
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.1);
    }

    .input-group .input-icon {
      position: absolute;
      left: 14px;
      bottom: 14px;
      color: var(--text-muted);
      font-size: 0.9rem;
      pointer-events: none;
    }

    .toggle-password-btn {
      position: absolute;
      right: 14px;
      bottom: 14px;
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.95rem;
      transition: color var(--transition-fast);
    }

    .toggle-password-btn:hover {
      color: var(--accent-cyan);
    }

    .password-strength {
      margin-top: 6px;
      height: 3px;
      border-radius: 2px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0;
      border-radius: 2px;
      transition: width 0.3s ease, background 0.3s ease;
    }

    .strength-bar.weak { width: 33%; background: var(--accent-red); }
    .strength-bar.medium { width: 66%; background: var(--accent-yellow); }
    .strength-bar.strong { width: 100%; background: var(--accent-green); }

    .reset-card .btn {
      width: 100%;
      padding: 16px;
      font-size: 1rem;
      margin-top: var(--space-md);
    }
  </style>
</head>
<body class="page-enter">

  <a href="./index.html" class="back-home">
    <i class="fa-solid fa-arrow-left"></i>
    <span class="nav-logo"><span class="logo-dev">DEV</span><span class="logo-path">PATH</span></span>
  </a>

  <div class="reset-card">
    <div id="loadingBox" style="text-align: center; padding: var(--space-xl) 0;">
      <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 2rem; color: var(--accent-cyan);"></i>
      <p style="margin-top: 12px; color: var(--text-secondary); font-size: 0.9rem;">Verifying security token...</p>
    </div>

    <div id="invalidBox" style="display: none; text-align: center;">
      <div style="font-size: 3rem; color: var(--accent-red); margin-bottom: 1rem;">
        <i class="fa-solid fa-circle-xmark"></i>
      </div>
      <h2>Invalid or Expired Link</h2>
      <p style="color: var(--text-muted); margin: 1rem 0 1.5rem;">This password reset link is invalid or has expired for security reasons.</p>
      <a href="./SignUp_LogIn_Form.html" class="btn btn-primary">Request New Reset Link</a>
    </div>

    <form id="resetForm" style="display: none;" onsubmit="return false;">
      <h2>Set New Password</h2>
      <p class="reset-subtitle" id="resetSub">Choose a strong, secure password for your account</p>

      <div id="errorBox" class="error-box"></div>
      <div id="successBox" class="success-box"></div>

      <div class="input-group">
        <label for="newPassword">New Password</label>
        <input type="password" id="newPassword" placeholder="Enter new password (min 6 characters)" required>
        <i class="fa-solid fa-lock input-icon"></i>
        <button type="button" class="toggle-password-btn" data-target="newPassword"><i class="fa-regular fa-eye"></i></button>
        <div class="password-strength">
          <div class="strength-bar" id="strengthBar"></div>
        </div>
      </div>

      <div class="input-group">
        <label for="confirmPassword">Confirm New Password</label>
        <input type="password" id="confirmPassword" placeholder="Confirm your new password" required>
        <i class="fa-solid fa-shield-halved input-icon"></i>
        <button type="button" class="toggle-password-btn" data-target="confirmPassword"><i class="fa-regular fa-eye"></i></button>
      </div>

      <button type="submit" class="btn btn-primary" id="submitBtn">Update Password</button>
    </form>
  </div>

  <script>
    // Extract token from query params
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    const loadingBox = document.getElementById('loadingBox');
    const invalidBox = document.getElementById('invalidBox');
    const resetForm = document.getElementById('resetForm');
    const resetSub = document.getElementById('resetSub');
    const errorBox = document.getElementById('errorBox');
    const successBox = document.getElementById('successBox');
    const submitBtn = document.getElementById('submitBtn');

    // Show/hide eye toggle
    document.querySelectorAll('.toggle-password-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const targetId = btn.dataset.target;
        const input = document.getElementById(targetId);
        if (input.type === 'password') {
          input.type = 'text';
          btn.innerHTML = '<i class="fa-regular fa-eye-slash"></i>';
        } else {
          input.type = 'password';
          btn.innerHTML = '<i class="fa-regular fa-eye"></i>';
        }
      });
    });

    // Password strength meter
    const newPassword = document.getElementById('newPassword');
    const strengthBar = document.getElementById('strengthBar');

    newPassword.addEventListener('input', (e) => {
      const val = e.target.value;
      strengthBar.className = 'strength-bar';
      if (!val) { strengthBar.style.width = '0'; return; }

      let strength = 0;
      if (val.length >= 6) strength++;
      if (val.length >= 10) strength++;
      if (/[A-Z]/.test(val) && /[0-9]/.test(val)) strength++;
      if (/[^A-Za-z0-9]/.test(val)) strength++;

      if (strength <= 1) strengthBar.classList.add('weak');
      else if (strength <= 2) strengthBar.classList.add('medium');
      else strengthBar.classList.add('strong');
    });

    // Token verification
    async function verifyToken() {
      if (!token) {
        loadingBox.style.display = 'none';
        invalidBox.style.display = 'block';
        return;
      }

      try {
        const res = await fetch('/api/auth/verify-reset-token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token })
        });

        const data = await res.json();
        loadingBox.style.display = 'none';

        if (res.ok && data.valid) {
          resetSub.textContent = `Resetting password for: ${data.email}`;
          resetForm.style.display = 'block';
        } else {
          invalidBox.style.display = 'block';
        }
      } catch (err) {
        loadingBox.style.display = 'none';
        invalidBox.style.display = 'block';
      }
    }

    verifyToken();

    // Submit new password
    resetForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBox.style.display = 'none';
      successBox.style.display = 'none';

      const pass = newPassword.value;
      const confirmPass = document.getElementById('confirmPassword').value;

      if (pass !== confirmPass) {
        errorBox.textContent = 'Passwords do not match. Please re-enter.';
        errorBox.style.display = 'block';
        return;
      }

      if (pass.length < 6) {
        errorBox.textContent = 'Password must be at least 6 characters long.';
        errorBox.style.display = 'block';
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Updating Password...';

      try {
        const res = await fetch('/api/auth/reset-password', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token, newPassword: pass })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Password reset failed');

        successBox.innerHTML = '<i class="fa-solid fa-circle-check"></i> ' + data.message + '<br><small>Redirecting to login...</small>';
        successBox.style.display = 'block';

        setTimeout(() => {
          window.location.href = './SignUp_LogIn_Form.html';
        }, 1800);
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Update Password';
      }
    });
  </script>
</body>
</html>
